<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAERMIN v7.0 - Investment Engine Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e293b;
      color: #f8fafc;
      padding: 2rem;
    }
    h1 { margin-bottom: 1.5rem; color: #8b5cf6; }
    h2 { margin: 1.5rem 0 1rem; color: #94a3b8; font-size: 1rem; }
    .test-result {
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-result.pass { background: rgba(34, 197, 94, 0.2); }
    .test-result.fail { background: rgba(239, 68, 68, 0.2); }
    .status { font-weight: bold; }
    .status.pass { color: #22c55e; }
    .status.fail { color: #ef4444; }
    .summary {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .summary h3 { color: #8b5cf6; margin-bottom: 1rem; }
    .engine-test {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }
    .engine-test h3 { color: #f59e0b; margin-bottom: 1rem; }
    pre {
      background: rgba(0,0,0,0.3);
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
      font-size: 0.875rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.5rem;
    }
    button:hover { background: #7c3aed; }
  </style>
</head>
<body>
  <h1>MAERMIN v7.0 - Investment Engine Test</h1>
  
  <div id="results"></div>
  
  <div class="engine-test">
    <h3>Live Engine Tests</h3>
    <button onclick="testDCAEngine()">Test DCA Engine</button>
    <button onclick="testOptionsEngine()">Test Options Engine</button>
    <button onclick="testGoalEngine()">Test Goal Engine</button>
    <pre id="test-output">Click a button to run tests...</pre>
  </div>
  
  <div class="summary" id="summary"></div>

  <!-- Load all engines -->
  <script src="dca-analyzer-engine.js"></script>
  <script src="dividend-tracker-engine.js"></script>
  <script src="benchmark-engine.js"></script>
  <script src="goal-investing-engine.js"></script>
  <script src="portfolio-optimizer-engine.js"></script>
  <script src="factor-analysis-engine.js"></script>
  <script src="sector-allocation-engine.js"></script>
  <script src="currency-exposure-engine.js"></script>
  <script src="liquidity-analysis-engine.js"></script>
  <script src="economic-indicator-engine.js"></script>
  <script src="options-derivatives-engine.js"></script>
  <script src="attribution-engine.js"></script>
  <script src="tax-withdrawal-engine.js"></script>
  <script src="margin-leverage-engine.js"></script>
  <script src="sentiment-news-engine.js"></script>

  <script>
    const engines = [
      { name: 'DCA Analyzer', global: 'DCAAnalyzerEngine', key: 'compareDCAvsLumpSum' },
      { name: 'Dividend Tracker', global: 'DividendTracker', key: 'calculateDividendYield' },
      { name: 'Benchmark Engine', global: 'BenchmarkEngine', key: 'comparePerformance' },
      { name: 'Goal Investing', global: 'GoalInvestingEngine', key: 'createGoal' },
      { name: 'Portfolio Optimizer', global: 'PortfolioOptimizer', key: 'calculateEfficientFrontier' },
      { name: 'Factor Analysis', global: 'FactorAnalysisEngine', key: 'calculatePortfolioFactorExposures' },
      { name: 'Sector Allocation', global: 'SectorAllocationEngine', key: 'calculateSectorAllocation' },
      { name: 'Currency Exposure', global: 'CurrencyExposureEngine', key: 'calculateCurrencyExposure' },
      { name: 'Liquidity Analysis', global: 'LiquidityAnalysisEngine', key: 'calculatePortfolioLiquidity' },
      { name: 'Economic Indicator', global: 'EconomicIndicatorEngine', key: 'createEconomicDashboard' },
      { name: 'Options/Derivatives', global: 'OptionsEngine', key: 'blackScholes' },
      { name: 'Attribution', global: 'AttributionEngine', key: 'calculateBrinsonAttribution' },
      { name: 'Tax Withdrawal', global: 'TaxWithdrawalEngine', key: 'calculateCapitalGainsTax' },
      { name: 'Margin/Leverage', global: 'MarginLeverageEngine', key: 'createMarginAccount' },
      { name: 'Sentiment/News', global: 'SentimentNewsEngine', key: 'analyzeTextSentiment' }
    ];

    function runTests() {
      const resultsDiv = document.getElementById('results');
      let html = '<h2>Engine Loading Status</h2>';
      let passed = 0;
      let failed = 0;

      engines.forEach(engine => {
        const exists = typeof window[engine.global] !== 'undefined';
        const hasKey = exists && typeof window[engine.global][engine.key] === 'function';
        const status = exists && hasKey;
        
        if (status) passed++;
        else failed++;

        html += `
          <div class="test-result ${status ? 'pass' : 'fail'}">
            <span>${engine.name} (window.${engine.global})</span>
            <span class="status ${status ? 'pass' : 'fail'}">${status ? '✓ PASS' : '✗ FAIL'}</span>
          </div>
        `;
      });

      resultsDiv.innerHTML = html;

      document.getElementById('summary').innerHTML = `
        <h3>Summary</h3>
        <p>Passed: <span style="color: #22c55e; font-weight: bold;">${passed}</span></p>
        <p>Failed: <span style="color: #ef4444; font-weight: bold;">${failed}</span></p>
        <p>Total: ${engines.length}</p>
        <p style="margin-top: 1rem; color: ${failed === 0 ? '#22c55e' : '#f59e0b'}">
          ${failed === 0 ? '✓ All engines loaded successfully!' : '⚠ Some engines failed to load'}
        </p>
      `;
    }

    function testDCAEngine() {
      const output = document.getElementById('test-output');
      try {
        const priceHistory = [100, 105, 95, 110, 98, 115, 102, 120, 108, 125, 112, 130, 118, 135];
        const result = window.DCAAnalyzerEngine.compareDCAvsLumpSum(10000, priceHistory, {
          dcaPeriods: 12,
          dcaFrequency: 'monthly'
        });
        output.textContent = 'DCA Engine Test Result:\n' + JSON.stringify(result, null, 2);
      } catch (e) {
        output.textContent = 'Error: ' + e.message;
      }
    }

    function testOptionsEngine() {
      const output = document.getElementById('test-output');
      try {
        const price = window.OptionsEngine.blackScholes('call', 100, 100, 0.25, 0.05, 0.25);
        const greeks = window.OptionsEngine.calculateGreeks('call', 100, 100, 0.25, 0.05, 0.25);
        output.textContent = 'Options Engine Test Result:\n' + 
          'Call Option Price: ' + price.toFixed(4) + '\n' +
          'Greeks: ' + JSON.stringify(greeks, null, 2);
      } catch (e) {
        output.textContent = 'Error: ' + e.message;
      }
    }

    function testGoalEngine() {
      const output = document.getElementById('test-output');
      try {
        const goal = window.GoalInvestingEngine.createGoal({
          name: 'House Down Payment',
          type: 'house',
          targetAmount: 50000,
          currentAmount: 10000,
          targetDate: '2027-01-01',
          monthlyContribution: 500
        });
        const progress = window.GoalInvestingEngine.calculateGoalProgress(goal);
        output.textContent = 'Goal Engine Test Result:\n' + 
          'Goal: ' + JSON.stringify(goal, null, 2) + '\n\n' +
          'Progress: ' + JSON.stringify(progress, null, 2);
      } catch (e) {
        output.textContent = 'Error: ' + e.message;
      }
    }

    // Run tests on load
    window.onload = runTests;
  </script>
</body>
</html>
