<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redesign directions</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* PROTOTYPE gallery — redesign Phase 1. Not part of the app. */
  :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --text: #16151d; --dim: #5d5b6c; --line: #e3e2ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0d13; --card: #17161f; --text: #efeef4; --dim: #a09eb2; --line: #2a2938; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Geist', system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.02em; }
  p.lead { color: var(--dim); max-width: 760px; margin: 0 0 32px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 22px; }
  h2 { margin: 0; font-size: 20px; } h2 small { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .idea { color: var(--dim); margin: 6px 0 16px; max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  a.shot { display: block; text-decoration: none; color: inherit; }
  a.shot div { height: 220px; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: #000; }
  a.shot img { width: 100%; display: block; }
  a.shot span { display: block; font-size: 13px; color: var(--dim); margin-top: 6px; }
  .themes { font-size: 13px; color: var(--dim); margin-top: 12px; }
  .themes a { color: inherit; margin-right: 10px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
<h1>MAERMIN redesign — three directions</h1>
<p class="lead">Demo data only. Open a screen and use ← / → to compare the same screen across directions; the yellow bar switches theme, privacy mode and Simple mode. Details and trade-offs: <a href="DIRECTIONS.md">DIRECTIONS.md</a> · audit: <a href="../REDESIGN-AUDIT.md">REDESIGN-AUDIT.md</a>.</p>
<div id="dirs"></div>
</main>
<script>
  var D = [
    ['quiet-ledger', 'A · Quiet Ledger', 'calm and spacious', 'For the long-term investor: three answers in plain sentences, one column, warm paper and ink, one sage accent.'],
    ['trading-desk', 'B · Trading Desk', 'dense, for power users', 'Every number on one screen: compact sidebar with g+key hints, KPI strip, panels, 32 px rows, monospaced figures, bulk actions.'],
    ['atlas-map', 'C · Atlas Map', 'answer-first · recommended', 'The whole map of your wealth: net worth and what it is made of, answers that open their detail, a holdings map, master–detail transactions.']
  ];
  var S = [['overview', 'Overview', 'light'], ['transactions', 'Transactions', 'dark'], ['returns', 'Returns', 'light'], ['phone-overview', 'Phone overview (DE)', 'dark']];
  document.getElementById('dirs').innerHTML = D.map(function (d) {
    return '<section><h2>' + d[1] + '<small>' + d[2] + '</small></h2><p class="idea">' + d[3] + '</p><div class="grid">' +
      S.map(function (s) { return '<a class="shot" href="' + d[0] + '/' + s[0] + '.html?theme=' + s[2] + '"><div><img loading="lazy" alt="' + d[1] + ', ' + s[1] + '" src="shots/' + d[0] + '--' + s[0] + '--' + s[2] + '.jpg"></div><span>' + s[1] + ' · ' + s[2] + '</span></a>'; }).join('') +
      '</div><div class="themes">Overview in: ' + ['dark', 'light', 'nebula', 'contrast', 'cb'].map(function (t) { return '<a href="' + d[0] + '/overview.html?theme=' + t + '">' + t + '</a>'; }).join('') + '<a href="' + d[0] + '/overview.html?theme=dark&mask=1">privacy mode</a><a href="' + d[0] + '/overview.html?theme=dark&mode=simple">Simple mode</a></div></section>';
  }).join('');
</script>
</body>
</html>
