name = "maermin-skinport-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Deploy: wrangler deploy
# Set secret: wrangler secret put PRICEMPIRE_KEY

# E2E cloud sync (Epic 1) stores only ciphertext. Create the namespace, then
# paste the printed id below:
#   wrangler kv namespace create SYNC
[[kv_namespaces]]
binding = "SYNC"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
