<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAERMIN v6.0 - Investment Engines Test Suite</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      color: #00ff88;
      border-bottom: 2px solid #00ff88;
      padding-bottom: 10px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .summary-card {
      background: #1a1a2e;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .summary-card .number {
      font-size: 2.5em;
      font-weight: bold;
    }
    .summary-card.pass .number { color: #00ff88; }
    .summary-card.fail .number { color: #ff4444; }
    .summary-card.total .number { color: #00aaff; }
    .summary-card.rate .number { color: #ffaa00; }
    
    .test-section {
      background: #1a1a2e;
      margin: 15px 0;
      border-radius: 8px;
      overflow: hidden;
    }
    .test-section-header {
      background: #252540;
      padding: 15px 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-section-header:hover { background: #303050; }
    .test-section-content { padding: 10px 20px; display: none; }
    .test-section.expanded .test-section-content { display: block; }
    
    .test-result {
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
    }
    .test-result.pass { background: rgba(0, 255, 136, 0.1); border-left: 3px solid #00ff88; }
    .test-result.fail { background: rgba(255, 68, 68, 0.1); border-left: 3px solid #ff4444; }
    
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8em;
    }
    .badge.pass { background: #00ff88; color: #000; }
    .badge.fail { background: #ff4444; color: #fff; }
    
    #console {
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 15px;
      border-radius: 8px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-top: 20px;
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      font-size: 1.2em;
      color: #00aaff;
    }
    .loading::after {
      content: '';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 MAERMIN v6.0 - Investment Engines Test Suite</h1>
    
    <div id="loading" class="loading">Loading engines and running tests</div>
    
    <div id="results" style="display: none;">
      <div class="summary">
        <div class="summary-card total">
          <div class="number" id="total-tests">0</div>
          <div>Total Tests</div>
        </div>
        <div class="summary-card pass">
          <div class="number" id="pass-count">0</div>
          <div>Passed</div>
        </div>
        <div class="summary-card fail">
          <div class="number" id="fail-count">0</div>
          <div>Failed</div>
        </div>
        <div class="summary-card rate">
          <div class="number" id="success-rate">0%</div>
          <div>Success Rate</div>
        </div>
      </div>
      
      <div id="test-sections"></div>
    </div>
    
    <h2>Console Output</h2>
    <div id="console"></div>
  </div>

  <!-- Load all engines -->
  <script src="dca-analyzer-engine.js"></script>
  <script src="dividend-tracker-engine.js"></script>
  <script src="benchmark-engine.js"></script>
  <script src="goal-investing-engine.js"></script>
  <script src="portfolio-optimizer-engine.js"></script>
  <script src="factor-analysis-engine.js"></script>
  <script src="sector-allocation-engine.js"></script>
  <script src="currency-exposure-engine.js"></script>
  <script src="liquidity-analysis-engine.js"></script>
  <script src="economic-indicator-engine.js"></script>
  <script src="options-derivatives-engine.js"></script>
  <script src="attribution-engine.js"></script>
  <script src="tax-withdrawal-engine.js"></script>
  <script src="margin-leverage-engine.js"></script>
  <script src="sentiment-news-engine.js"></script>

  <script>
    // Console capture
    var consoleDiv = document.getElementById('console');
    var originalLog = console.log;
    console.log = function() {
      var args = Array.prototype.slice.call(arguments);
      var message = args.map(function(a) {
        return typeof a === 'object' ? JSON.stringify(a, null, 2) : a;
      }).join(' ');
      consoleDiv.textContent += message + '\n';
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
      originalLog.apply(console, arguments);
    };

    // Test runner
    var testResults = {};
    var passCount = 0;
    var failCount = 0;

    function runTest(section, name, testFn) {
      if (!testResults[section]) testResults[section] = [];
      
      try {
        var result = testFn();
        if (result && result.success !== false) {
          console.log('[PASS] ' + name);
          passCount++;
          testResults[section].push({ name: name, status: 'pass' });
        } else {
          console.log('[FAIL] ' + name + ': ' + (result ? result.error : 'returned falsy'));
          failCount++;
          testResults[section].push({ name: name, status: 'fail', error: result ? result.error : 'returned falsy' });
        }
      } catch (e) {
        console.log('[FAIL] ' + name + ': ' + e.message);
        failCount++;
        testResults[section].push({ name: name, status: 'fail', error: e.message });
      }
    }

    // Sample data
    var samplePortfolio = {
      crypto: [
        { symbol: 'BTC', amount: 0.5, purchasePrice: 30000, currentPrice: 45000, purchaseDate: '2023-06-15' },
        { symbol: 'ETH', amount: 5, purchasePrice: 1800, currentPrice: 2500, purchaseDate: '2023-08-01' },
        { symbol: 'SOL', amount: 50, purchasePrice: 25, currentPrice: 100, purchaseDate: '2024-01-15' }
      ],
      stocks: [
        { symbol: 'AAPL', amount: 20, purchasePrice: 150, currentPrice: 180 },
        { symbol: 'MSFT', amount: 15, purchasePrice: 300, currentPrice: 380 },
        { symbol: 'GOOGL', amount: 10, purchasePrice: 120, currentPrice: 145 },
        { symbol: 'NVDA', amount: 8, purchasePrice: 250, currentPrice: 480 },
        { symbol: 'TSLA', amount: 12, purchasePrice: 200, currentPrice: 245 }
      ],
      skins: [
        { name: 'AWP Dragon Lore', amount: 1, purchasePrice: 5000, currentPrice: 7500 }
      ]
    };

    var priceHistory = [];
    for (var i = 365; i >= 0; i--) {
      var date = new Date();
      date.setDate(date.getDate() - i);
      priceHistory.push({
        date: date.toISOString().split('T')[0],
        price: 100 + Math.sin(i / 30) * 20 + (365 - i) * 0.1 + Math.random() * 5
      });
    }

    // Run tests after small delay
    setTimeout(function() {
      console.log('========================================');
      console.log('MAERMIN v6.0 - Investment Engines Test Suite');
      console.log('========================================\n');

      // Test each engine
      runTest('DCA Analyzer', 'analyzeDCAvsLumpSum', function() {
        return DCAAnalyzerEngine.analyzeDCAvsLumpSum(10000, priceHistory, 'monthly');
      });
      runTest('DCA Analyzer', 'simulateDCAPerformance', function() {
        return DCAAnalyzerEngine.simulateDCAPerformance(500, 12, priceHistory);
      });
      runTest('DCA Analyzer', 'findOptimalDCAFrequency', function() {
        return DCAAnalyzerEngine.findOptimalDCAFrequency(10000, priceHistory);
      });

      runTest('Dividend Tracker', 'trackDividendIncome', function() {
        return DividendTrackerEngine.trackDividendIncome([
          { symbol: 'AAPL', shares: 100, dividendPerShare: 0.96, frequency: 'quarterly' }
        ]);
      });
      runTest('Dividend Tracker', 'simulateDRIP', function() {
        return DividendTrackerEngine.simulateDRIP(
          { symbol: 'AAPL', shares: 100, dividendPerShare: 0.96, stockPrice: 180 }, 10
        );
      });

      runTest('Benchmark', 'comparePerformance', function() {
        var p = priceHistory.map(function(x) { return x.price; });
        var b = priceHistory.map(function(x) { return x.price * 0.95; });
        return BenchmarkEngine.comparePerformance(p, b);
      });
      runTest('Benchmark', 'calculateBetaAlpha', function() {
        return BenchmarkEngine.calculateBetaAlpha([0.05, 0.03, -0.02], [0.04, 0.02, -0.01]);
      });

      runTest('Goal Investing', 'createGoal', function() {
        return GoalInvestingEngine.createGoal({
          name: 'House', type: 'house', targetAmount: 50000, currentAmount: 15000,
          targetDate: '2027-01-01', monthlyContribution: 1000
        });
      });
      runTest('Goal Investing', 'simulateGoalProbability', function() {
        return GoalInvestingEngine.simulateGoalProbability(
          { targetAmount: 50000, currentAmount: 15000, targetDate: '2027-01-01', monthlyContribution: 1000 },
          { expectedReturn: 0.07, volatility: 0.15 }
        );
      });

      runTest('Portfolio Optimizer', 'findMinimumVariancePortfolio', function() {
        return PortfolioOptimizerEngine.findMinimumVariancePortfolio(
          ['AAPL', 'MSFT'],
          { AAPL: [0.02, 0.03, -0.01], MSFT: [0.03, 0.02, 0.01] }
        );
      });
      runTest('Portfolio Optimizer', 'calculateEfficientFrontier', function() {
        return PortfolioOptimizerEngine.calculateEfficientFrontier(
          ['AAPL', 'MSFT'], { AAPL: [0.02, 0.03], MSFT: [0.03, 0.02] }, 10
        );
      });

      runTest('Factor Analysis', 'getFactorExposure', function() {
        return FactorAnalysisEngine.getFactorExposure('AAPL');
      });
      runTest('Factor Analysis', 'calculatePortfolioFactorExposures', function() {
        return FactorAnalysisEngine.calculatePortfolioFactorExposures(samplePortfolio);
      });
      runTest('Factor Analysis', 'calculateStyleBox', function() {
        return FactorAnalysisEngine.calculateStyleBox(samplePortfolio);
      });

      runTest('Sector Allocation', 'calculateSectorAllocation', function() {
        return SectorAllocationEngine.calculateSectorAllocation(samplePortfolio);
      });
      runTest('Sector Allocation', 'analyzeSectorConcentration', function() {
        var alloc = SectorAllocationEngine.calculateSectorAllocation(samplePortfolio);
        return SectorAllocationEngine.analyzeSectorConcentration(alloc);
      });

      runTest('Currency Exposure', 'calculateCurrencyExposure', function() {
        return CurrencyExposureEngine.calculateCurrencyExposure(samplePortfolio, 'EUR');
      });
      runTest('Currency Exposure', 'generateHedgingRecommendations', function() {
        var exp = CurrencyExposureEngine.calculateCurrencyExposure(samplePortfolio, 'EUR');
        return CurrencyExposureEngine.generateHedgingRecommendations(exp, 'EUR', 'moderate');
      });

      runTest('Liquidity Analysis', 'calculatePortfolioLiquidity', function() {
        return LiquidityAnalysisEngine.calculatePortfolioLiquidity(samplePortfolio, null);
      });
      runTest('Liquidity Analysis', 'analyzeLiquidityRisk', function() {
        var liq = LiquidityAnalysisEngine.calculatePortfolioLiquidity(samplePortfolio, null);
        return LiquidityAnalysisEngine.analyzeLiquidityRisk(liq, null);
      });

      runTest('Economic Indicator', 'createEconomicDashboard', function() {
        return EconomicIndicatorEngine.createEconomicDashboard({ gdpGrowth: 2.5, cpi: 3.2 });
      });
      runTest('Economic Indicator', 'calculateRecessionProbability', function() {
        return EconomicIndicatorEngine.calculateRecessionProbability({ yieldCurveSpread: -20, pmi: 48 });
      });

      runTest('Options Engine', 'blackScholes', function() {
        var price = OptionsEngine.blackScholes('call', 100, 100, 0.25, 0.05, 0.20);
        return price > 0 ? { price: price } : null;
      });
      runTest('Options Engine', 'calculateGreeks', function() {
        return OptionsEngine.calculateGreeks('call', 100, 100, 0.25, 0.05, 0.20);
      });

      runTest('Attribution', 'calculateBrinsonAttribution', function() {
        return AttributionEngine.calculateBrinsonAttribution(
          { Tech: 0.4, Health: 0.3, Finance: 0.3 },
          { Tech: 0.3, Health: 0.35, Finance: 0.35 },
          { Tech: 0.15, Health: 0.08, Finance: 0.05 },
          { Tech: 0.12, Health: 0.10, Finance: 0.06 }
        );
      });

      runTest('Tax Withdrawal', 'calculateCapitalGainsTax', function() {
        return TaxWithdrawalEngine.calculateCapitalGainsTax(5000, { isMarried: false });
      });
      runTest('Tax Withdrawal', 'analyzeCryptoTaxStrategy', function() {
        return TaxWithdrawalEngine.analyzeCryptoTaxStrategy(samplePortfolio.crypto);
      });

      runTest('Margin Leverage', 'calculateMarginMetrics', function() {
        return MarginLeverageEngine.calculateMarginMetrics({
          accountValue: 50000, marginDebt: 15000, marginRate: 0.08,
          positions: [{ symbol: 'AAPL', amount: 100, currentPrice: 180, assetType: 'stocks' }]
        });
      });
      runTest('Margin Leverage', 'calculateOptimalLeverage', function() {
        return MarginLeverageEngine.calculateOptimalLeverage(
          { volatility: 0.20, expectedReturn: 0.10 }, 'moderate', 0.25
        );
      });

      runTest('Sentiment News', 'analyzeTextSentiment (positive)', function() {
        var r = SentimentNewsEngine.analyzeTextSentiment('Stock prices surge on strong earnings');
        return r && r.score > 0 ? r : null;
      });
      runTest('Sentiment News', 'analyzeTextSentiment (negative)', function() {
        var r = SentimentNewsEngine.analyzeTextSentiment('Markets crash amid recession fears');
        return r && r.score < 0 ? r : null;
      });
      runTest('Sentiment News', 'calculateFearGreedIndex', function() {
        return SentimentNewsEngine.calculateFearGreedIndex({
          priceVsMA: 0.3, volatility: -0.2, momentum: 0.4
        });
      });

      // Display results
      document.getElementById('loading').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      
      document.getElementById('total-tests').textContent = passCount + failCount;
      document.getElementById('pass-count').textContent = passCount;
      document.getElementById('fail-count').textContent = failCount;
      document.getElementById('success-rate').textContent = 
        ((passCount / (passCount + failCount)) * 100).toFixed(1) + '%';

      // Build test sections
      var sectionsHtml = '';
      for (var section in testResults) {
        var tests = testResults[section];
        var sectionPass = tests.filter(function(t) { return t.status === 'pass'; }).length;
        var sectionTotal = tests.length;
        
        sectionsHtml += '<div class="test-section" onclick="this.classList.toggle(\'expanded\')">';
        sectionsHtml += '<div class="test-section-header">';
        sectionsHtml += '<span>' + section + '</span>';
        sectionsHtml += '<span class="badge ' + (sectionPass === sectionTotal ? 'pass' : 'fail') + '">';
        sectionsHtml += sectionPass + '/' + sectionTotal + '</span>';
        sectionsHtml += '</div>';
        sectionsHtml += '<div class="test-section-content">';
        
        tests.forEach(function(test) {
          sectionsHtml += '<div class="test-result ' + test.status + '">';
          sectionsHtml += '<span>' + test.name + '</span>';
          sectionsHtml += '<span class="badge ' + test.status + '">' + test.status.toUpperCase() + '</span>';
          sectionsHtml += '</div>';
        });
        
        sectionsHtml += '</div></div>';
      }
      
      document.getElementById('test-sections').innerHTML = sectionsHtml;

      console.log('\n========================================');
      console.log('TEST SUMMARY');
      console.log('========================================');
      console.log('Total: ' + (passCount + failCount) + ' | Pass: ' + passCount + ' | Fail: ' + failCount);
      console.log('Success Rate: ' + ((passCount / (passCount + failCount)) * 100).toFixed(1) + '%');
      console.log('========================================');
      
    }, 500);
  </script>
</body>
</html>
