<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- GitHub Pages: CSP ohne 'self'-Beschränkung, alle nötigen APIs erlaubt -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://community.akamai.steamstatic.com; connect-src 'self' https://api.coingecko.com https://api.exchangerate-api.com https://open.er-api.com https://www.alphavantage.co https://*.workers.dev https://cdnjs.cloudflare.com; worker-src 'none'; object-src 'none';">
  <title>MAERMIN v9.0 - Professional Portfolio Tracker</title>

  <!-- Open Graph / Social Preview -->
  <meta property="og:title" content="MAERMIN v9.0 – Professional Portfolio Tracker">
  <meta property="og:description" content="Multi-Asset Portfolio Tracker: Crypto, Stocks & CS2 Items mit Advanced Analytics">
  <meta property="og:type" content="website">
  
  <!-- React from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Auth (lädt sofort, bevor der Rest der App startet) -->
  <script src="auth.js"></script>
  
  <!-- PDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div id="loading">
    <h1>MAERMIN</h1>
    <div class="version-badge">v9.0</div>
    <div class="subtitle">Multi-Asset Portfolio Tracker with Advanced Analysis</div>
    <div id="module-status">Initializing...</div>
    <div class="loader"></div>
  </div>
  
  <div id="root"></div>
  
  <script>
    const updateStatus = (msg) => {
      const el = document.getElementById('module-status');
      if (el) el.textContent = msg;
    };
  </script>
  
  <!-- MAERMIN v9.0 - CORE MODULES -->
  <script>updateStatus('Loading core modules...');</script>
  <script src="utils.js"></script>
  <script src="translations-complete.js"></script>
  <script src="validation-comprehensive.js"></script>
  <script src="calculator-extended.js"></script>
  <script src="tax-calculation-engine.js"></script>
  <script src="risk-analytics.js"></script>
  <script src="risk-analytics-view-v2.js"></script>
  <script src="tax-pdf-export.js"></script>
  
  <!-- MAERMIN v6.0 - ANALYSIS MODULES -->
  <script>updateStatus('Loading analysis modules...');</script>
  <script src="monte-carlo-engine.js"></script>
  <script src="correlation-engine.js"></script>
  <script src="stress-test-engine.js"></script>
  <script src="command-palette.js"></script>
  <script src="import-export-engine.js"></script>
  
  <!-- MAERMIN v9.0 - INVESTMENT ENGINES -->
  <script>updateStatus('Loading investment engines...');</script>
  <script src="dca-analyzer-engine.js"></script>
  
  <!-- MAERMIN v9.0 - UI COMPONENTS -->
  <script>updateStatus('Loading UI components...');</script>
  <script src="dividend-data-service.js"></script>
  <script src="renderer-components.js"></script>
  <script src="investment-views.js"></script>
  <script src="dividend-tracker-view-enhanced.js"></script>
  <script src="portfolio-health.js"></script>

  <!-- MAERMIN v9.0 - EXTENDED FEATURES -->
  <script>updateStatus('Loading extended features...');</script>
  <script src="features.js"></script>
  <script src="features2.js"></script>
  <script src="features3.js"></script>
  <script src="features4.js"></script>
  <script src="features5.js"></script>
  <script src="features6.js">
  </script>
  <script src="features7.js"></script>
  
  <!-- MAIN APPLICATION -->
  <script>updateStatus('Loading main application...');</script>
  <script src="renderer.js"></script>
  
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        updateStatus('Ready!');
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.classList.add('hidden');
            setTimeout(() => loading.remove(), 500);
          }
        }, 500);
      }, 300);
    });
    
    console.log('%c[MAERMIN v9.0] Professional Portfolio Tracker', 'font-size: 20px; font-weight: bold; color: #7e22ce; background: #f3e8ff; padding: 8px;');
    console.log('[INFO] v9.0: Benchmark, Position Detail, CAGR, Daily P&L, CS2 pricing');
    console.log('[INFO] DCA Analyzer, Dividend Tracker, Benchmark Comparison');
    console.log('[INFO] Goal Planning, Portfolio Optimization, Factor Analysis');
    console.log('[INFO] Sector Allocation, Currency Exposure, Liquidity Analysis');
    console.log('[INFO] Economic Indicators, Options/Greeks, Attribution');
    console.log('[INFO] Tax Withdrawal Planning, Margin Tracker, Sentiment Analysis');
    console.log('[INFO] Press Ctrl+K to open Command Palette');
    
    setTimeout(() => {
      const checks = [
        { name: 'React', check: () => typeof React !== 'undefined' },
        { name: 'ReactDOM', check: () => typeof ReactDOM !== 'undefined' },
        { name: 'Monte Carlo Engine', check: () => typeof window.MonteCarloEngine !== 'undefined' },
        { name: 'Correlation Engine', check: () => typeof window.CorrelationEngine !== 'undefined' },
        { name: 'Stress Test Engine', check: () => typeof window.StressTestEngine !== 'undefined' },
        { name: 'Risk Analytics View', check: () => typeof window.RiskAnalyticsViewV2 !== 'undefined' },
        { name: 'DCA Analyzer Engine', check: () => typeof window.DCAAnalyzerEngine !== 'undefined' },
        { name: 'Tax Calculation Engine', check: () => typeof window.TaxCalculationEngine !== 'undefined' },
        { name: 'Import/Export Engine', check: () => typeof window.ImportExportEngine !== 'undefined' },
        { name: 'Dividend Data Service', check: () => typeof window.DividendDataService !== 'undefined' },
        { name: 'Enhanced Dividend View', check: () => typeof window.EnhancedDividendTrackerView !== 'undefined' },
        { name: 'Investment Views', check: () => typeof window.InvestmentViews !== 'undefined' },
        { name: 'Command Palette', check: () => typeof window.CommandPalette !== 'undefined' },
        { name: 'jsPDF', check: () => typeof window.jspdf !== 'undefined' }
      ];
      
      console.log('[MODULE CHECK MAERMIN v9.0]');
      let loaded = 0;
      checks.forEach(item => {
        const status = item.check();
        if (status) loaded++;
        console.log('  ' + (status ? '✅' : '❌') + ' ' + item.name);
      });
      
      console.log(`[LOADED] ${loaded}/${checks.length} modules`);
      if (loaded === checks.length) {
        console.log('%c✅ All modules loaded!', 'color: #22c55e; font-weight: bold');
      } else {
        console.warn(`⚠️ ${checks.length - loaded} module(s) missing – check errors above`);
      }
    }, 1500);
  </script>
  
</body>
</html>
