document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er;justify-content:center;font-size:0.95rem;\">{{ o.icon }}<\u002Fdiv><div style=\"flex:1;\"><div style=\"font-size:0.84rem;font-weight:600;\">{{ o.title }}<\u002Fdiv><div style=\"font-size:0.74rem;color:#8b94a7;\">{{ o.sub }}<\u002Fdiv><\u002Fdiv><span style=\"color:#5b6577;font-size:1rem;\">↓<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <!-- ===================== COMMAND PALETTE ===================== -->\n  <sc-if value=\"{{ paletteOpen }}\">\n  <div onclick=\"{{ closePalette }}\" style=\"position:fixed;inset:0;background:rgba(4,6,10,0.62);backdrop-filter:blur(8px);z-index:100;display:flex;justify-content:center;padding-top:11vh;\">\n    <div onclick=\"{{ stop }}\" style=\"width:640px;max-width:92vw;height:fit-content;max-height:70vh;background:rgba(20,26,37,0.97);border:1px solid rgba(255,255,255,0.08);border-radius:18px;box-shadow:0 32px 70px -20px rgba(0,0,0,0.8);overflow:hidden;display:flex;flex-direction:column;animation:palIn 0.16s cubic-bezier(0.16,1,0.3,1);\">\n      <input id=\"cmdInput\" value=\"{{ query }}\" onchange=\"{{ onQuery }}\" placeholder=\"Search 23 features — e.g. tax, rebalance, dividends…\" style=\"width:100%;padding:1.05rem 1.3rem;font-size:1rem;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.08);color:#e9edf4;outline:none;font-family:inherit;letter-spacing:-0.01em;\">\n      <div style=\"overflow-y:auto;padding:0.4rem;\">\n        <sc-for list=\"{{ commands }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <div onclick=\"{{ c.onClick }}\" style=\"padding:0.6rem 0.8rem;display:flex;align-items:center;gap:0.85rem;cursor:pointer;border-radius:10px;\" style-hover=\"background:rgba(255,255,255,0.06)\">\n            <div style=\"width:30px;height:30px;border-radius:9px;background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.9rem;\">{{ c.icon }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0;\"><div style=\"font-size:0.88rem;font-weight:500;\">{{ c.label }}<\u002Fdiv><div style=\"font-size:0.74rem;color:#8b94a7;\">{{ c.hint }}<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:0.66rem;color:#5b6577;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:0.12rem 0.4rem;\">{{ c.group }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ noResults }}\"><div style=\"padding:1.4rem;text-align:center;color:#5b6577;font-size:0.85rem;\">No matches for “{{ query }}”<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:0.65rem 1.3rem;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:1.2rem;font-size:0.72rem;color:#5b6577;\"><span>Click to open<\u002Fspan><span>esc to close<\u002Fspan><span style=\"margin-left:auto;font-family:'JetBrains Mono';\">⌘K<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 860 },\n  &quot;accent&quot;: {\n    &quot;editor&quot;: &quot;color&quot;,\n    &quot;default&quot;: &quot;#f5a524&quot;,\n    &quot;options&quot;: [&quot;#f5a524&quot;, &quot;#5b9dff&quot;, &quot;#2dd4a7&quot;, &quot;#a78bfa&quot;, &quot;#fb6f92&quot;],\n    &quot;tsType&quot;: &quot;string&quot;\n  },\n  &quot;surface&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;default&quot;: &quot;Midnight&quot;,\n    &quot;options&quot;: [&quot;Midnight&quot;, &quot;Slate&quot;, &quot;Carbon&quot;, &quot;Ink&quot;],\n    &quot;tsType&quot;: &quot;string&quot;\n  },\n  &quot;density&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;default&quot;: &quot;Comfortable&quot;,\n    &quot;options&quot;: [&quot;Compact&quot;, &quot;Comfortable&quot;, &quot;Spacious&quot;],\n    &quot;tsType&quot;: &quot;string&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  state = { view: 'overview', analyticsTab: 'returns', discoverTab: 'discovery', paletteOpen: false, query: '' };\n\n  componentDidMount() {\n    this._onKey = (e) => {\n      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {\n        e.preventDefault();\n        this.setState(s => ({ paletteOpen: !s.paletteOpen, query: '' }));\n      } else if (e.key === 'Escape' && this.state.paletteOpen) {\n        this.setState({ paletteOpen: false });\n      }\n    };\n    window.addEventListener('keydown', this._onKey);\n    this.applyTheme();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this._onKey);\n    if (this._root) this._root.style.zoom = '';\n  }\n  componentDidUpdate(pp, ps) {\n    if (this.state.paletteOpen && !(ps && ps.paletteOpen)) {\n      const el = document.getElementById('cmdInput');\n      if (el) el.focus();\n    }\n    this.applyTheme();\n  }\n\n  applyTheme() {\n    const r = document.documentElement;\n    r.style.setProperty('--accent', this.props.accent || '#f5a524');\n    const surfaces = {\n      Midnight: { bg1:'#19212f', bg2:'#0c111a', bg3:'#080b11', surface:'#10151f', 'surface-hi':'#121826', inset:'#0e131d', track:'#161c28' },\n      Slate:    { bg1:'#1f2940', bg2:'#121a2b', bg3:'#0c1019', surface:'#151c2b', 'surface-hi':'#1a2336', inset:'#121a28', track:'#1f2a3d' },\n      Carbon:   { bg1:'#24242a', bg2:'#141417', bg3:'#0b0b0d', surface:'#161619', 'surface-hi':'#1c1c20', inset:'#121214', track:'#26262c' },\n      Ink:      { bg1:'#141b2e', bg2:'#080c16', bg3:'#04060c', surface:'#0b1018', 'surface-hi':'#0e1422', inset:'#080c14', track:'#121a2a' },\n    };\n    const s = surfaces[this.props.surface] || surfaces.Midnight;\n    Object.keys(s).forEach(k => r.style.setProperty('--' + k, s[k]));\n    const z = ({ Compact: '0.9', Comfortable: '1', Spacious: '1.12' })[this.props.density] || '1';\n    if (this._root) this._root.style.zoom = z;\n  }\n\n  go(view, sub) {\n    return () => this.setState(Object.assign({ view, paletteOpen: false, query: '' }, sub || {}));\n  }\n\n  renderVals() {\n    const v = this.state.view;\n    const mk = (key, label, icon, count) => ({\n      label, icon, count, onClick: this.go(key),\n      fg: key === v ? 'var(--accent)' : '#8b94a7',\n      bg: key === v ? 'color-mix(in srgb, var(--accent) 12%, transparent)' : 'transparent',\n      weight: key === v ? '600' : '500',\n      bar: key === v ? 'block' : 'none',\n    });\n\n    const navPlatform = [\n      mk('overview', 'Overview', '\\u229E'),\n      mk('transactions', 'Transactions', '\\u21C5'),\n      mk('portfolios', 'Portfolios', '\\u25A6'),\n      mk('networth', 'Net Worth', '\\u2211'),\n      mk('dividends', 'Dividends', '\\u2756'),\n      mk('journal', 'Journal', '\\u270E'),\n    ];\n    const navInsights = [\n      mk('analytics', 'Analytics', '\\u25EB', '9'),\n      mk('discover', 'Discover', '\\u25CE', '8'),\n    ];\n\n    const at = this.state.analyticsTab;\n    const tabStyle = (active) => active\n      ? { bg: 'var(--accent)', fg: '#13110a', weight: '700', border: '1px solid var(--accent)' }\n      : { bg: 'rgba(255,255,255,0.03)', fg: '#8b94a7', weight: '500', border: '1px solid rgba(255,255,255,0.08)' };\n    const atab = (key, label) => Object.assign({ label, onClick: () => this.setState({ analyticsTab: key }) }, tabStyle(at === key));\n    const analyticsTabs = [\n      atab('returns', 'Returns & XIRR'), atab('rebalancing', 'Rebalancing'), atab('savings', 'Savings Plans'),\n      atab('cashflow', 'Cash Flow'), atab('fees', 'Fee Analyzer'), atab('risk', 'Risk & Correlation'),\n      atab('health', 'Health Score'), atab('strategy', 'Strategy'), atab('tax', 'Tax & FIFO'),\n    ];\n    const dt = this.state.discoverTab;\n    const dtab = (key, label) => Object.assign({ label, onClick: () => this.setState({ discoverTab: key }) }, tabStyle(dt === key));\n    const discoverTabs = [\n      dtab('discovery', 'Discovery'), dtab('share', 'Share & Compare'), dtab('watchlist', 'Watchlist'),\n      dtab('alerts', 'Price Alerts'), dtab('attribution', 'Attribution'), dtab('realized', 'Realized P&L'),\n      dtab('news', 'News Feed'), dtab('data', 'Import / Export'),\n    ];\n\n    // ---- command palette: all 23 features ----\n    const q = (this.state.query || '').toLowerCase();\n    const allCmds = [\n      { label: 'Overview', hint: 'Portfolio summary & positions', icon: '\\u229E', group: 'Portfolio', view: 'overview' },\n      { label: 'Transactions', hint: 'All buys, sells & dividends', icon: '\\u21C5', group: 'Portfolio', view: 'transactions' },\n      { label: 'Portfolios', hint: 'Manage multiple portfolios', icon: '\\u25A6', group: 'Portfolio', view: 'portfolios' },\n      { label: 'Net Worth', hint: 'Accounts, assets & liabilities', icon: '\\u2211', group: 'Portfolio', view: 'networth' },\n      { label: 'Dividends', hint: 'Income calendar & forecast', icon: '\\u2756', group: 'Portfolio', view: 'dividends' },\n      { label: 'Journal', hint: 'Trade notes & theses', icon: '\\u270E', group: 'Portfolio', view: 'journal' },\n      { label: 'Returns & XIRR', hint: 'Money- & time-weighted returns', icon: '\\u2197', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'returns' } },\n      { label: 'Rebalancing', hint: 'Drift from target & trades', icon: '\\u21CC', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'rebalancing' } },\n      { label: 'Savings Plans', hint: 'Recurring buys / DCA', icon: '\\u2295', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'savings' } },\n      { label: 'Cash Flow', hint: 'Deposits & withdrawals', icon: '\\u223F', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'cashflow' } },\n      { label: 'Fee Analyzer', hint: 'Fees by type & per trade', icon: '%', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'fees' } },\n      { label: 'Risk & Correlation', hint: 'Volatility, drawdown, correlation', icon: '\\u25EB', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'risk' } },\n      { label: 'Health Score', hint: 'Diversification & concentration', icon: '\\u271A', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'health' } },\n      { label: 'Strategy', hint: 'Model mix & factor tilts', icon: '\\u229B', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'strategy' } },\n      { label: 'Tax & FIFO', hint: 'German cost-basis & PDF export', icon: '\\u00A7', group: 'Analytics', view: 'analytics', sub: { analyticsTab: 'tax' } },\n      { label: 'Discovery', hint: 'Trending assets to explore', icon: '\\u25CE', group: 'Tools', view: 'discover', sub: { discoverTab: 'discovery' } },\n      { label: 'Share & Compare', hint: 'Benchmark & shareable snapshot', icon: '\\u22B6', group: 'Tools', view: 'discover', sub: { discoverTab: 'share' } },\n      { label: 'Watchlist', hint: 'Track assets you do not own', icon: '\\u2606', group: 'Tools', view: 'discover', sub: { discoverTab: 'watchlist' } },\n      { label: 'Price Alerts', hint: 'Above / below price triggers', icon: '\\u2691', group: 'Tools', view: 'discover', sub: { discoverTab: 'alerts' } },\n      { label: 'Attribution', hint: 'Contribution to total return', icon: '\\u22BF', group: 'Tools', view: 'discover', sub: { discoverTab: 'attribution' } },\n      { label: 'Realized P&L', hint: 'Closed positions & win rate', icon: '\\u2713', group: 'Tools', view: 'discover', sub: { discoverTab: 'realized' } },\n      { label: 'News Feed', hint: 'Headlines for your holdings', icon: '\\u2630', group: 'Tools', view: 'discover', sub: { discoverTab: 'news' } },\n      { label: 'Import / Export', hint: 'CSV, broker connect, backup', icon: '\\u21C6', group: 'Tools', view: 'discover', sub: { discoverTab: 'data' } },\n    ];\n    const commands = allCmds\n      .filter(c => !q || (c.label + ' ' + c.hint + ' ' + c.g
